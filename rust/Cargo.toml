[package]
name = "rust_lib_noisyboy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
cpal = "0.15"
ringbuf = "0.4"
anyhow = "1"
